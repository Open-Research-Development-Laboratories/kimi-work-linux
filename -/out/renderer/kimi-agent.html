  <head>
    <meta charset="UTF-8" />
    <!--
      CSP（KimiAgent 独立应用）：
      - app:// 协议加载本地资源
      - ws:/wss: 仅用于连接本地 daimon control server（ws://127.0.0.1:<random>），
        实际 WS 连接在 main 进程完成，renderer 走 IPC，但 CSP 仍开 ws: 以防未来需要
      - 多数 API 经 main 进程 daimon-host-manager.ts 代理；但技能详情弹窗复用的 @rat
        FileList 会在 renderer 直连签名文件 URL（无需鉴权，sig 自带），这些 URL 落在
        随环境/region 变化的多个主机上——kimi.com 的 /apiv2-files/sign-obj 代理 +
        对象存储直链（如 *.volces.com 的 Volcengine TOS）。逐个白名单是 whack-a-mole，
        故 connect-src 放行 https:（img-src 本就已是 https:）。renderer 是 first-party
        bundle、不载入不可信内容，可接受此放宽。
      - 同理，技能文件预览的 PDF 走 pdfjs viewer iframe（statics.moonshot.cn），Office
        走 WPS iframe，故 frame-src 放行 https:；媒体类文件用 <video>/<audio>，故
        media-src 放行 https:。三者均对齐 kimi.com file-view 预览栈需要。
      - Work 文件预览的 HTML 走 kimi-preview:// iframe（main 进程从本地目录服务该文件，
        见 kimi-preview-protocol.ts），故 frame-src 放行 kimi-preview:。该 iframe 是
        独立 origin、无 preload，本身不继承此 CSP——这正是它能加载外链 CDN/字体的原因。
      - Website Artifact 会把 Agent 启动的本地 React 开发站点（http://localhost:<port>）
        放进右栏 iframe，故 frame-src 额外放行 http:；远程地址仍沿用既有 https:。
      - 附件图片缩略图/lightbox 走 kimi-attach:// 流式 protocol（main 进程从本地路径流
        式喂 <img>，见 kimi-attach-protocol.ts；referrer 检查 + realpath 双重守门），故
        img-src 放行 kimi-attach:。替代以前的 getImageThumbnail base64 dataUrl IPC。
      - 本地 PDF 通过 kimi-pdf:// 按 Range 流式读取，绝对路径不进入 renderer，故
        connect-src 放行 kimi-pdf:。本地音/视频文件预览同理走 kimi-media://，
        由 <video>/<audio> 直接按 Range 播放，故 media-src 放行 kimi-media:。
      - 本地登录复用 LoginModal 的手机验证码用网易易盾(yidun) captcha，它会动态从易盾
        CDN 加载 load.min.js 等挑战脚本，故 script-src 放行 *.126.net（cstaticdun 系列）
        与 *.dun.163.com（运行时挑战脚本）。海外节点用 163yun.com 域（如
        c.dun.163yun.com/api/v3/check），fingerprint 探针走 *.nstool.netease.com/ip.js，
        两个域名走 CSP 拒载会让验证码完全跑不起来，故一并放行。connect/img 已是 https:
        无需另开。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' app: blob: data:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' app: blob: https://*.126.net https://*.dun.163.com https://*.163yun.com https://*.nstool.netease.com;
        style-src 'self' 'unsafe-inline' app: blob:;
        img-src 'self' app: https: http: blob: data: kimi-attach:;
        font-src 'self' app: blob: data:;
        connect-src 'self' app: blob: https: kimi-pdf: kimi-model:;
        worker-src 'self' blob:;
        frame-src 'self' app: https: http: blob: kimi-preview: kimi-widget:;
        media-src 'self' app: https: blob: kimi-media:;
      "
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Agent</title>
    <!--
      根级重置：清掉浏览器默认 body margin: 8px，锁死 100% 高度 + overflow: hidden。
      必须 inline 在 head 里，先于 Vue 挂载，避免 FOUC。
    -->

        padding: 0;
