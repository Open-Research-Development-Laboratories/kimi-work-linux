<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP 策略（DesktopClaw 独立应用）：
      - app:// 协议加载本地资源
      - ws: 允许连接本地 gateway（ws://127.0.0.1:18679）
      - 不需要 https 外部资源（API 请求通过 main process 代理）
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' app: blob: data:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' app: blob:;
        style-src 'self' 'unsafe-inline' app: blob:;
        img-src 'self' app: https: http: blob: data:;
        font-src 'self' app: blob: data:;
        connect-src 'self' app: ws: wss: blob:;
        worker-src 'self' blob:;
      "
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Claw</title>
    <!--
      根级重置：清掉浏览器默认 body margin: 8px（否则四周漏出 BaseWindow 底色），
      锁死 100% 高度 + overflow: hidden（避免页面级滚动条；只让 ChatView 内部消息列表这种
      显式可滚组件滚动）。必须 inline 在 head 里，先于 Vue 挂载，避免 FOUC。
    -->
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
